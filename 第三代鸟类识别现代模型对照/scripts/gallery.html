<!doctype html><html lang="zh"><meta charset="utf-8"><title>第三代鸟类分类对照</title><style>body{font:16px system-ui;background:#f4f6f8;margin:24px;color:#182334}header{background:white;padding:20px;border-radius:12px}input,select{font:inherit;padding:8px;margin:8px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}article{background:white;margin-top:20px;padding:16px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}canvas{width:100%;height:auto}.bad{color:#bc2733}.score{font-size:13px;line-height:1.7}details{background:#f5f6f8;padding:8px}.muted{color:#64748b}button{padding:9px;font:inherit}</style><header><h1>第二代与第三代：同框分类对照</h1><p>同一172张验证图、同一177个检测分数&gt;30%的去重框；外扩15%。类别分歧与鸟的数量是否匹配分别记录。分类得分不是“判断正确的概率”。这是用于探索与选权重的验证集，不是独立测试。</p><div id="summary"></div><input id="search" placeholder="搜索文件名或类别"><select id="filter"><option value="diff">任一模型类别与所属类别不同</option><option value="all">全部图片</option><option value="improved">相对第二代消除类别分歧</option><option value="regressed">相对第二代新增类别分歧</option><option value="empty">无显示框</option></select><label><input id="gt" type="checkbox">显示人工标注框</label><span id="count"></span></header><main id="cards"></main><button id="more">加载更多</button><script>const D=__DATA__;let shown=0,filtered=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const keys=Object.keys(D.models);document.querySelector('#summary').innerHTML='<table><tr><th>模型</th><th>类别分歧图片</th><th>无框图片</th><th>P</th><th>R</th><th>F1</th></tr>'+keys.map(k=>{let s=D.summary[k];return `<tr><td>${esc(D.models[k])}</td><td>${s.class_disagreement_images}</td><td>${s.no_display_images}</td><td>${s.precision.toFixed(4)}</td><td>${s.recall.toFixed(4)}</td><td>${s.F1.toFixed(4)}</td></tr>`}).join('')+'</table>';
function draw(c,r,k){let im=new Image();im.onload=()=>{c.width=im.width;c.height=im.height;let x=c.getContext('2d');x.drawImage(im,0,0);let sx=im.width/r.width,sy=im.height/r.height;x.font='bold 15px system-ui';x.lineWidth=2;function box(p,color,text){let b=p.bbox_xyxy;x.strokeStyle=color;x.strokeRect(b[0]*sx,b[1]*sy,(b[2]-b[0])*sx,(b[3]-b[1])*sy);let xx=Math.max(0,b[0]*sx),yy=Math.max(18,b[1]*sy);let tw=x.measureText(text).width;x.fillStyle=color;x.fillRect(xx,yy-18,tw+8,20);x.fillStyle='white';x.fillText(text,xx+4,yy-3)}if(document.querySelector('#gt').checked)r.truth.forEach((p,i)=>box(p,'#166534','人工 '+p.class_name));r.models[k].displayed.forEach((p,i)=>box(p,p.different_from_folder?'#bc2733':'#1d4ed8',`${i+1} ${p.class_name} ${(p.classifier_top_score*100).toFixed(1)}%`));};im.src=r.image}
function more(){let chunk=filtered.slice(shown,shown+12);shown+=chunk.length;for(let r of chunk){let a=document.createElement('article');a.innerHTML=`<h2>${esc(r.filename)} <small>所属：${esc(r.expected)}</small></h2><div class="grid">`+keys.map(k=>{let v=r.models[k];return `<section><h3>${esc(D.models[k])} ${v.class_disagreement?'<span class="bad">类别分歧</span>':''}</h3><canvas data-model="${k}"></canvas><p class="muted">${v.displayed.length}个显示框；TP ${v.TP} / FP ${v.FP} / FN ${v.FN}</p>`+v.displayed.map((p,i)=>`<details><summary>${i+1}：${esc(p.class_name)}，检测 ${(p.detector_score*100).toFixed(1)}%，分类 ${(p.classifier_top_score*100).toFixed(1)}%</summary><div class="score">`+Object.entries(p.classifier_scores).sort((a,b)=>b[1]-a[1]).map(([n,s])=>`${esc(n)} ${(s*100).toFixed(2)}%`).join('<br>')+'</div></details>').join('')+'</section>'}).join('')+'</div>';document.querySelector('#cards').appendChild(a);a.querySelectorAll('canvas').forEach(c=>draw(c,r,c.dataset.model))}document.querySelector('#more').hidden=shown>=filtered.length;document.querySelector('#count').textContent=`筛选 ${filtered.length} 张，已显示 ${shown} 张`}
function render(){let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;filtered=D.rows.filter(r=>{let base=r.models.gen2_bilinear_best,novel=keys.filter(k=>k!=='gen2_bilinear_best').map(k=>r.models[k]);return(r.filename+r.expected).toLowerCase().includes(q)&&(f==='all'||f==='diff'&&keys.some(k=>r.models[k].class_disagreement)||f==='empty'&&base.no_display||f==='improved'&&base.class_disagreement&&novel.some(v=>!v.class_disagreement)||f==='regressed'&&!base.class_disagreement&&novel.some(v=>v.class_disagreement))});shown=0;document.querySelector('#cards').innerHTML='';more()};document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;document.querySelector('#gt').onchange=render;document.querySelector('#more').onclick=more;render();</script></html>
