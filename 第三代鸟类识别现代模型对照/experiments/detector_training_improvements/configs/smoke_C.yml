  dataset_dir: E:/机器学习课设/自然场景鸟类检测PPYOLOE/data/prepared
LearningRate:
  base_lr: 0.0001
  schedulers:
  - name: CosineDecay
    max_epochs: 1
  - name: LinearWarmup
    start_factor: 0.0
    epochs: 0
TrainReader:
  batch_size: 2
  collate_batch: true
  worker_num: 0
  use_shared_memory: false
  shuffle: true
  drop_last: false
  sample_transforms:
  - Decode: {}
  - RandomDistort:
      hue:
      - -6
      - 6
      - 0.5
      saturation:
      - 0.85
      - 1.15
      - 0.5
      contrast:
      - 0.85
      - 1.15
      - 0.5
      brightness:
      - 0.85
      - 1.15
      - 0.5
      random_apply: true
      count: 4
      random_channel: false
      prob: 0.6
  - RandomCrop:
      aspect_ratio:
      - 0.75
      - 1.33
      thresholds:
      - 0.3
      - 0.5
      - 0.7
      scaling:
      - 0.75
      - 1.0
      num_attempts: 20
      allow_no_crop: true
      cover_all_box: false
      ioumode: iou
      prob: 0.35
      use_box_candidates: true
      wh_thr: 4
      ar_thr: 40
      area_thr: 0.7
  - RandomFlip:
      prob: 0.5
  - RandomErasingImage:
      prob: 0.15
      lower: 0.05
      higher: 0.15
      aspect_ratio: 0.3
  batch_transforms:
  - BatchRandomResize:
      target_size:
      - 480
      - 512
      - 544
      - 576
      - 608
      - 640
      - 672
      - 704
      - 736
      - 768
      random_size: true
      random_interp: false
      keep_ratio: false
  - NormalizeImage:
      mean:
      - 0.0
      - 0.0
      - 0.0
      std:
      - 1.0
      - 1.0
      - 1.0
      is_scale: false
      norm_type: none
  - Permute: {}
  - PadGT: {}
EvalReader:
  batch_size: 1
  worker_num: 0
TestReader:
  inputs_def:
    image_shape:
    - 3
    - 640
    - 640
  batch_size: 1
  worker_num: 0
PPYOLOEHead:
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.001
    nms_threshold: 0.7
  eval_size:
  - 640
  - 640
use_gpu: true
