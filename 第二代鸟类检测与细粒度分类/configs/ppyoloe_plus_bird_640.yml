# 官方 PaddleDetection 2.9 PP-YOLOE+ s；直接继承官方完整COCO模型结构。
_BASE_: [
  '../../自然场景鸟类检测PPYOLOE/third_party/PaddleDetection/configs/ppyoloe/ppyoloe_plus_crn_s_80e_coco.yml'
]

metric: COCO
num_classes: 1
epoch: 100
snapshot_epoch: 5
log_iter: 20
worker_num: 0
weights: E:/机器学习课设/第二代鸟类检测与细粒度分类/runs/detector/model_final
save_dir: E:/机器学习课设/第二代鸟类检测与细粒度分类/runs/detector
pretrain_weights: E:/机器学习课设/第二代鸟类检测与细粒度分类/weights/ppyoloe_plus_crn_s_80e_coco.pdparams

TrainDataset:
  name: COCODataSet
  image_dir: images/train
  anno_path: E:/机器学习课设/第二代鸟类检测与细粒度分类/data/annotations/instances_train_bird.json
  dataset_dir: E:/机器学习课设/自然场景鸟类检测PPYOLOE/data/prepared
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  image_dir: images/val
  anno_path: E:/机器学习课设/第二代鸟类检测与细粒度分类/data/annotations/instances_val_bird.json
  dataset_dir: E:/机器学习课设/自然场景鸟类检测PPYOLOE/data/prepared
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: E:/机器学习课设/第二代鸟类检测与细粒度分类/data/annotations/instances_val_bird.json
  dataset_dir: E:/机器学习课设/自然场景鸟类检测PPYOLOE/data/prepared

# 首轮按8GB显存保守设置；确认卡上峰值显存后再决定是否调整。
LearningRate:
  base_lr: 0.0003125
  schedulers:
    - name: CosineDecay
      max_epochs: 100
    - name: LinearWarmup
      start_factor: 0.0
      epochs: 5

TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomFlip: {prob: 0.5}
    - Resize: {target_size: [640, 640], keep_ratio: false, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - Permute: {}
  batch_transforms:
    - PadGT: {}
  batch_size: 2
  collate_batch: true
  worker_num: 0
  use_shared_memory: false
  shuffle: true
  drop_last: false

EvalReader:
  batch_size: 1
  worker_num: 0

TestReader:
  inputs_def:
    image_shape: [3, 640, 640]
  batch_size: 1
  worker_num: 0

PPYOLOEHead:
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.001
    nms_threshold: 0.7
