<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二代最高置信度框对照</title>
<style>body{margin:0;background:#f3f6fa;color:#23364a;font:16px "Microsoft YaHei",sans-serif}main{max-width:1500px;padding:20px;margin:auto}h1{font-size:26px}p{line-height:1.7}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#f3f6fa;padding:14px 0;position:sticky;top:0;z-index:1}button,select,input{font:inherit;padding:7px}button{cursor:pointer}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:white;padding:12px;border:1px solid #d8e0ea}.panel h3{font-size:17px;margin:0 0 10px}svg{display:block;width:100%;max-height:700px;cursor:zoom-in}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;background:white}td,th{padding:9px;border-bottom:1px solid #dae1eb;text-align:left}th{background:#24476a;color:white}details{margin:18px 0;padding:12px;background:white}summary{cursor:pointer;font-weight:bold}.hint{color:#63758a}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:90vw;max-height:84vh}dialog::backdrop{background:#0008}@media(max-width:800px){.panels{grid-template-columns:1fr}main{padding:12px}}</style>
<main><h1>第二代：同一鸟的重叠框保留最高置信度框</h1><p>按检测置信度从高到低保留框；与已保留框的 IoU ≥ 0.5 时隐藏。类别不影响去重。两侧均只画检测置信度严格超过50%的框。左右使用同一模型的原有结果，无需重新训练。</p><p class="hint">重叠框不一定属于同一只鸟，挤在一起的鸟可能误合并，请重点看多鸟图片。检测分数表示定位信心，分类分数另列；本页“最高”指检测置信度最高。图片已嵌入，可离线查看。</p><div id="summary"></div>
<div class="bar"><select id="model"><option value="resnet">ResNet18</option><option value="bilinear">Bilinear CNN</option></select><input id="search" placeholder="搜索文件名"><label><input type="checkbox" id="changed">仅看去重后变化图片</label><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span><label><input type="checkbox" id="gt">叠加人工框</label></div>
<h2 id="filename"></h2><div class="panels"><section class="panel"><h3 id="beforeTitle"></h3><div id="before"></div></section><section class="panel"><h3 id="afterTitle"></h3><div id="after"></div></section></div><p class="hint">橙色框：模型预测；绿色框：人工XML。点击图片放大原图。</p>
<h3>保留框的八类分类分数</h3><div id="kept" class="scroll"></div><details><summary id="hiddenTitle"></summary><div id="hidden" class="scroll"></div></details><details><summary>完整候选数据（包含低于显示阈值的框，不叠加在图片上）</summary><div id="all" class="scroll"></div></details></main>
<dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let filtered=[],index=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(ds){return '<table><thead><tr><th>类别</th><th>检测置信度</th><th>分类最高分</th><th>框 xyxy</th><th>八类分类分数</th></tr></thead><tbody>'+ds.map(d=>'<tr><td>'+esc(d.class_name)+'</td><td>'+(100*d.detector_score).toFixed(2)+'%</td><td>'+(100*d.classifier_top_score).toFixed(2)+'%</td><td>'+d.bbox_xyxy.map(v=>v.toFixed(1)).join(', ')+'</td><td>'+Object.entries(d.classifier_scores||{}).map(([n,s])=>esc(n)+' '+(100*s).toFixed(2)+'%').join('；')+'</td></tr>').join('')+'</tbody></table>';}
function svg(row,ds){let out=`<svg viewBox="0 0 ${row.width} ${row.height}" role="img" aria-label="${esc(row.filename)}"><image href="${row.image}" width="${row.width}" height="${row.height}"/>`;const font=Math.max(15,row.width/55),stroke=Math.max(2,row.width/400);const boxes=ds.map(d=>({d,color:'#ea581e',label:d.class_name+' 检测'+(d.detector_score*100).toFixed(1)+'%'}));if($('gt').checked)boxes.push(...row.truth.map(d=>({d,color:'#16a34a',label:'标注 '+d.class_name})));for(const {d,color,label}of boxes){const [x,y,x2,y2]=d.bbox_xyxy;out+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="${color}" stroke-width="${stroke}"/><text x="${Math.max(0,Math.min(x,row.width-300))}" y="${Math.max(font,y-4)}" font-size="${font}" fill="white" stroke="#263344" stroke-width="${font/10}" paint-order="stroke">${esc(label)}</text>`;}return out+'</svg>';}
function render(){const r=filtered[index];$('prev').disabled=index<=0;$('next').disabled=index>=filtered.length-1;$('select').value=String(index);$('count').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';if(!r){$('filename').textContent='没有符合筛选条件的图片';for(const id of ['before','after','kept','hidden','all'])$(id).innerHTML='';return;}const m=r[$('model').value];$('filename').textContent=r.filename;$('beforeTitle').textContent=`去重前：${m.before.length} 个显示框`;$('afterTitle').textContent=`去重后：${m.after.length} 个显示框`;$('before').innerHTML=svg(r,m.before);$('after').innerHTML=svg(r,m.after);$('kept').innerHTML=table(m.after);$('hidden').innerHTML=table(m.hidden);$('all').innerHTML=table(m.all_candidates);$('hiddenTitle').textContent=`被去重隐藏的高分框：${m.hidden.length} 个（只列数据）`;for(const id of ['before','after'])$(id).onclick=()=>{$('zoomImage').src=r.image;$('zoomName').textContent=r.filename+' 原图';$('zoom').showModal();};}
function filter(){const name=filtered[index]?.filename;filtered=DATA.rows.filter(r=>r.filename.toLowerCase().includes($('search').value.toLowerCase())&&(!$('changed').checked||r[$('model').value].before.length!==r[$('model').value].after.length));index=Math.max(0,filtered.findIndex(r=>r.filename===name));$('select').innerHTML=filtered.map((r,i)=>`<option value="${i}">${esc(r.filename)}</option>`).join('');const s=DATA.summary[$('model').value];$('summary').textContent=`固定验证集 ${s.images} 张：显示框 ${s.before_boxes} → ${s.after_boxes}；${s.changed_images} 张有变化。`;render();}
$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('model').onchange=filter;$('search').oninput=filter;$('changed').onchange=filter;$('gt').onchange=render;$('close').onclick=()=>$('zoom').close();filter();
</script></html>
