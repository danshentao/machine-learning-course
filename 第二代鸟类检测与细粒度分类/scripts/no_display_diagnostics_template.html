<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十三张无显示框诊断</title><style>
body{font:16px "Microsoft YaHei",sans-serif;background:#f3f6fa;color:#24374a;margin:0}main{max-width:1750px;padding:20px;margin:auto}p{line-height:1.7}h1{font-size:26px}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#f3f6fa;position:sticky;top:0;padding:14px 0;z-index:2}select,button,input{font:inherit;padding:7px}.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.panel{background:white;padding:12px;border:1px solid #dae2ec}h3{font-size:17px}svg{display:block;width:100%;max-height:660px;cursor:zoom-in}.hint{color:#65768a}.notice{padding:14px;background:#fff3d7;border-left:4px solid #d79a23}table{border-collapse:collapse;background:white;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #d8e1eb;text-align:left}th{background:#25476a;color:white}.scroll{overflow:auto}details{background:white;padding:12px;margin:18px 0}summary{cursor:pointer}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:90vw;max-height:83vh}dialog::backdrop{background:#0008}@media(max-width:1000px){.panels{grid-template-columns:1fr}}
</style><main><h1>第二代：十三张无显示框图片诊断</h1><p>这些图片在去重后没有检测置信度严格超过50%的框，因此正式页面不画框。此页临时显示低分候选以排查原因，正式阈值和原预测均未修改。两种分类器共用检测器，缺框的图片相同。</p><p class="hint">诊断仅使用已保存的每图前100个候选。IoU≥0.5用于粗略判断位置贴合现有人工框；不是确认鸟类正确。没有贴合候选，也不能推断原检测器所有输出都找不到鸟。</p><p id="summary"></p><div class="bar"><select id="filter"><option value="all">全部13张</option><option value="low">每个人工框都有低分候选</option><option value="missing">至少一个人工框没有贴合候选</option></select><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span><label><input type="checkbox" id="allboxes">画出全部100个候选（可能很密）</label></div><h2 id="filename"></h2><p id="issue" class="notice"></p><div class="panels"><section class="panel"><h3 id="firstTitle"></h3><div id="first"></div></section><section class="panel"><h3>第二代低分候选（仅诊断）</h3><div id="second"></div></section><section class="panel"><h3>人工XML框</h3><div id="truth"></div></section></div><p class="hint">蓝色：第一代正式显示框；橙色：第二代诊断候选及检测分数；绿色：人工框。点击图片放大原图。</p><h3>逐人工实例诊断</h3><div id="table" class="scroll"></div><details><summary>完整候选的检测分数和八类分类分数</summary><div class="scroll" id="candidates"></div></details></main><dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let filtered=[],index=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=s=>s==null?'无':(s*100).toFixed(2)+'%';
function svg(r,ds,color,kind){let out=`<svg viewBox="0 0 ${r.width} ${r.height}" role="img" aria-label="${esc(r.filename)}"><image href="${r.image}" width="${r.width}" height="${r.height}"/>`;const f=Math.max(16,r.width/46),s=Math.max(2,r.width/350);for(const d of ds){const [x,y,x2,y2]=d.bbox_xyxy;let t=kind==='truth'?d.class_name:kind==='first'?d.class_name+' '+pct(d.score):'候选 '+pct(d.detector_score);out+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="${color}" stroke-width="${s}"/><text x="${Math.max(0,Math.min(x,r.width-300))}" y="${Math.max(f,y-4)}" font-size="${f}" fill="white" stroke="#24374a" stroke-width="${f/10}" paint-order="stroke">${esc(t)}</text>`;}return out+'</svg>';}
function render(){const r=filtered[index];$('prev').disabled=index<=0;$('next').disabled=index>=filtered.length-1;$('select').value=String(index);$('count').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';if(!r){$('filename').textContent='没有符合条件的图片';for(const id of ['issue','first','second','truth','table','candidates'])$(id).innerHTML='';return;}$('filename').textContent=r.filename;$('issue').textContent=`第二代最高检测分数 ${pct(r.max_detector_score)}。`+(r.all_instances_have_candidate?'每个人工框都有位置贴合的低分候选，均被50%显示阈值过滤。':'至少一个人工框在已保存的100候选中没有IoU≥0.5的框。');$('firstTitle').textContent=`第一代正式显示：${r.first_display.length} 个框`;$('first').innerHTML=svg(r,r.first_display,'#2575c9','first');$('second').innerHTML=svg(r,$('allboxes').checked?r.candidates:r.selected_candidates,'#e8761c','second');$('truth').innerHTML=svg(r,r.truth,'#16a45c','truth');$('table').innerHTML='<table><thead><tr><th>人工实例／类别</th><th>位置诊断</th><th>对应候选检测分数</th><th>框IoU</th><th>候选分类／最高分（ResNet18）</th></tr></thead><tbody>'+r.diagnostics.map(d=>'<tr><td>'+d.instance+' '+esc(d.truth.class_name)+'</td><td>'+esc(d.reason)+'</td><td>'+pct(d.candidate?.detector_score)+'</td><td>'+(d.candidate_iou?.toFixed(3)??'无')+'</td><td>'+esc(d.candidate?.class_name||'无')+' '+pct(d.candidate?.classifier_top_score)+'</td></tr>').join('')+'</tbody></table>';$('candidates').innerHTML='<table><thead><tr><th>检测分数</th><th>预测类别</th><th>分类最高分</th><th>八类分类分数</th></tr></thead><tbody>'+r.candidates.map(d=>'<tr><td>'+pct(d.detector_score)+'</td><td>'+esc(d.class_name)+'</td><td>'+pct(d.classifier_top_score)+'</td><td>'+Object.entries(d.classifier_scores).map(([n,v])=>esc(n)+' '+pct(v)).join('；')+'</td></tr>').join('')+'</tbody></table>';for(const id of ['first','second','truth'])$(id).onclick=()=>{$('zoomImage').src=r.image;$('zoomName').textContent=r.filename;$('zoom').showModal();};}
function filter(){const mode=$('filter').value;filtered=DATA.rows.filter(r=>mode==='all'||(mode==='low'?r.all_instances_have_candidate:!r.all_instances_have_candidate));index=0;$('select').innerHTML=filtered.map((r,i)=>`<option value="${i}">${esc(r.filename)}</option>`).join('');render();}const s=DATA.summary;$('summary').textContent=`共${s.images}张：${s.all_instances_have_low_score_candidate}张的所有人工实例都有低分贴合候选；${s.at_least_one_instance_has_no_iou05_candidate}张至少有一个实例缺少贴合候选。这13张中，第一代有${s.first_generation_has_display}张能显示框。`;
$('filter').onchange=filter;$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('allboxes').onchange=render;$('close').onclick=()=>$('zoom').close();filter();
</script></html>
