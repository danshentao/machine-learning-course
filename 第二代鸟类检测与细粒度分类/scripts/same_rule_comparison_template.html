<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一代与第二代类别分歧对照</title><style>
body{font:16px "Microsoft YaHei",sans-serif;margin:0;background:#f3f6fa;color:#24374a}main{max-width:1750px;padding:20px;margin:auto}p{line-height:1.7}h1{font-size:26px}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:#f3f6fa;padding:14px 0;z-index:2}button,select,input{font:inherit;padding:7px}.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.panel{background:white;padding:12px;border:1px solid #d7e1eb}svg{display:block;width:100%;max-height:620px;cursor:zoom-in}h3{font-size:18px}table{width:100%;border-collapse:collapse;background:white;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #d7e1eb}th{background:#25476a;color:white}.hint{color:#65768b}.bad{color:#c9332b;font-weight:bold}.scroll{overflow:auto}.label{background:#e5edf7;padding:12px}dialog img{max-width:90vw;max-height:83vh}dialog{max-width:96vw;max-height:95vh}dialog::backdrop{background:#0008}@media(max-width:1000px){.panels{grid-template-columns:1fr}}
</style><main><h1>同一172张图：第一代与第二代类别对照</h1><p>各方案使用已有去重结果，并只显示超过50%阈值的框。任一显示类别不同于原图所属类别即计为类别分歧，不看鸟数、框位置或人工实例匹配。无显示框单独列出，不能当作识别正确。</p><p class="hint">第一代阈值作用于检测类别分数，第二代作用于单类检测分数；分数含义不同。本页用于比较实际显示效果。数据集所属类别不是对背景或每只鸟的人工裁决，分歧仍需复核。</p><div class="scroll" id="summary"></div><p id="transitions"></p><div class="bar"><select id="filter"><option value="any">任一方案有类别分歧</option><option value="gen1">第一代有分歧</option><option value="resnet">ResNet18有分歧</option><option value="bilinear">Bilinear CNN有分歧</option><option value="resnet_improved">ResNet18消除分歧且有显示框</option><option value="resnet_new">ResNet18新增分歧</option><option value="empty">任一方案没有显示框</option></select><input id="search" placeholder="搜索文件名或类别"><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span></div><h2 id="filename"></h2><p id="expected" class="label"></p><div class="panels" id="panels"></div><h3>各方案最终显示类别与分数</h3><div class="scroll" id="details"></div></main><dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),NAMES={gen1:'第一代 PP-YOLOE-s',resnet:'第二代＋ResNet18',bilinear:'第二代＋Bilinear CNN'};let filtered=[],index=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svg(r,ds){let out=`<svg viewBox="0 0 ${r.width} ${r.height}" role="img" aria-label="${esc(r.filename)}"><image href="${r.image}" width="${r.width}" height="${r.height}"/>`;const f=Math.max(16,r.width/43),s=Math.max(2,r.width/350);for(const d of ds){const [x,y,x2,y2]=d.bbox_xyxy,c=d.class_name!==r.expected?'#d9322c':'#ea761d';out+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="${c}" stroke-width="${s}"/><text x="${Math.max(0,Math.min(x,r.width-300))}" y="${Math.max(f,y-3)}" font-size="${f}" fill="white" stroke="#24374a" stroke-width="${f/10}" paint-order="stroke">${esc(d.class_name)} ${(100*d.score).toFixed(1)}%</text>`;}return out+'</svg>';}
function render(){const r=filtered[index];$('prev').disabled=index<=0;$('next').disabled=index>=filtered.length-1;$('select').value=String(index);$('count').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';if(!r){$('filename').textContent='没有符合条件的图片';for(const id of ['expected','panels','details'])$(id).innerHTML='';return;}$('filename').textContent=r.filename;$('expected').textContent='原图所属类别：'+r.expected+'（'+r.folder+'）';$('panels').innerHTML=Object.entries(NAMES).map(([m,n])=>`<section class="panel"><h3>${n}</h3><p class="${r.different[m]?'bad':''}">${r.no_display[m]?'无显示框':r.different[m]?'有类别分歧':'显示类别均与所属类别一致'}</p>${svg(r,r.models[m])}</section>`).join('');$('panels').querySelectorAll('svg').forEach(el=>el.onclick=()=>{$('zoomImage').src=r.image;$('zoomName').textContent=r.filename+' 原图';$('zoom').showModal();});$('details').innerHTML='<table><thead><tr><th>方案</th><th>预测类别</th><th>显示阈值分数</th><th>第二代分类最高分</th></tr></thead><tbody>'+Object.entries(NAMES).flatMap(([m,n])=>r.models[m].length?r.models[m].map(d=>'<tr><td>'+n+'</td><td class="'+(d.class_name!==r.expected?'bad':'')+'">'+esc(d.class_name)+'</td><td>'+(100*d.score).toFixed(2)+'%</td><td>'+(d.classifier_top_score==null?'不适用':(100*d.classifier_top_score).toFixed(2)+'%')+'</td></tr>'):['<tr><td>'+n+'</td><td colspan="3">无显示框</td></tr>']).join('')+'</tbody></table>';}
function filter(){const mode=$('filter').value,q=$('search').value.toLowerCase();filtered=DATA.rows.filter(r=>{let ok=mode==='any'?Object.values(r.different).some(Boolean):mode==='empty'?Object.values(r.no_display).some(Boolean):mode==='resnet_improved'?r.different.gen1&&!r.different.resnet&&!r.no_display.resnet:mode==='resnet_new'?!r.different.gen1&&r.different.resnet:r.different[mode];return ok&&(r.filename.toLowerCase().includes(q)||r.expected.includes(q));});index=0;$('select').innerHTML=filtered.map((r,i)=>`<option value="${i}">${esc(r.filename)}</option>`).join('');render();}
$('summary').innerHTML='<table><thead><tr><th>方案</th><th>检查图片</th><th>类别分歧图片</th><th>没有显示框</th><th>显示框总数</th></tr></thead><tbody>'+Object.entries(NAMES).map(([m,n])=>{const s=DATA.summary[m];return `<tr><td>${n}</td><td>${s.images}</td><td>${s.class_disagreement_images}</td><td>${s.no_display_images}</td><td>${s.displayed_boxes}</td></tr>`;}).join('')+'</tbody></table>';const t=DATA.transitions.resnet;$('transitions').textContent=`与第一代相比，ResNet18：${t.first_disagreement_second_no_disagreement_with_display.length} 张消除类别分歧且有显示框；${t.new_disagreement.length} 张新增类别分歧；${t.both_disagreement.length} 张仍有分歧；${t.first_disagreement_second_no_display.length} 张原有分歧图变为无显示框。`;
$('filter').onchange=filter;$('search').oninput=filter;$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('close').onclick=()=>$('zoom').close();filter();
</script></html>
