<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八张疑难训练图人工复核</title><style>
body{font-family:Microsoft YaHei,sans-serif;margin:0;background:#f4f6f9;color:#23364a}main{max-width:1400px;margin:auto;padding:22px}h1{font-size:25px}h2{font-size:20px}p{line-height:1.7}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 0;position:sticky;top:0;background:#f4f6f9;z-index:2}select,button,textarea{font:inherit;border:1px solid #bac9d8;border-radius:4px;padding:8px 12px;background:white}button{cursor:pointer}button:disabled{opacity:.4}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border:1px solid #dbe2eb;padding:14px;background:white}.panel h3{margin:0 0 10px;font-size:16px}svg{width:100%;max-height:650px;display:block;cursor:zoom-in}img.crop{max-width:100%;max-height:380px;cursor:zoom-in}.crops{display:flex;gap:14px;flex-wrap:wrap}.crop-card{background:white;padding:12px;border:1px solid #dbe2eb;max-width:420px}.question{padding:12px 16px;border-left:4px solid #d49617;background:#fff3d6;line-height:1.7}.note{color:#5e7184}table{width:100%;border-collapse:collapse;background:white}th,td{padding:9px;border-bottom:1px solid #dbe2eb;text-align:left}th{background:#24476a;color:white}textarea{box-sizing:border-box;width:100%;min-height:100px;resize:vertical}.review{background:white;padding:16px;margin:18px 0;border:1px solid #dbe2eb}.review label{display:block;margin:8px 0}dialog{max-width:96vw;max-height:96vh;padding:14px;border:1px solid #b9c9da}dialog img{max-width:90vw;max-height:83vh;object-fit:contain}dialog::backdrop{background:#0008}.scroll{overflow-x:auto}@media(max-width:800px){.panels{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><main><h1>八张疑难训练图人工复核</h1><p>这8张训练图当前处于隔离状态。请检查类别、鸟框范围和是否漏标；拿不准可继续排除。对照图119仅供参考，不属于本次8张训练图。</p><p class="note">绿色框是原始XML人工标注；红色框是第一代去重后置信度严格大于50%的预测，默认关闭，不能当作正确答案。点击图片或裁剪可放大。</p>
<div class="bar"><button id="prev">上一张</button><select id="select" aria-label="选择疑难图片"></select><button id="next">下一张</button><span id="count"></span><label><input id="showGT" type="checkbox" checked>显示人工框</label><label><input id="showPred" type="checkbox">显示模型提示框</label></div>
<h2 id="name"></h2><div class="question" id="question"></div><p id="labels"></p><div class="panels"><section class="panel"><h3 id="leftTitle"></h3><div id="left"></div></section><section class="panel"><h3 id="rightTitle"></h3><div id="right"></div></section></div>
<h2>当前图片的人工标注鸟体裁剪</h2><div id="crops" class="crops"></div><h2>人工实例与预测提示</h2><div id="table" class="scroll"></div>
<div class="review"><h2>记录你的判断</h2><label>选择结论：<select id="decision"><option value="">尚未检查</option><option value="原标注正确">原标注正确，可保留</option><option value="需要修改">需要修改类别、框或补标</option><option value="继续排除">拿不准，继续排除</option></select></label><label>说明修改位置、正确类别或排除原因：<textarea id="notes" placeholder="例如：第1只类别正确，框需要包含尾巴；或者右下角还有一只鸟，需要补标。"></textarea></label><p class="note" id="saveState">意见只在本浏览器本地保存，不会自动修改XML或训练数据。</p></div>
<button id="copy">汇总并复制8张图的复核意见</button><p id="copyState" class="note"></p><textarea id="output" readonly aria-label="复核意见汇总" placeholder="点击汇总后，可把这里的内容发给Luna。"></textarea>
</main><dialog id="zoom"><button id="close">关闭放大</button><p id="zoomTitle"></p><img id="zoomImage"></dialog>
<script id="data" type="application/json">__DATA__</script><script>
'use strict';const DATA=JSON.parse(document.getElementById('data').textContent),cards=DATA.cards,$=id=>document.getElementById(id);let index=0;
const key='bird_v2_eight_training_review_20261003';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}');}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svg(im,gt=true,pred=false){let out=`<svg viewBox="0 0 ${im.width} ${im.height}" role="img" aria-label="${esc(im.name)}"><image href="${im.image}" width="${im.width}" height="${im.height}"/>`;
 const font=Math.max(16,im.width/45),stroke=Math.max(2,im.width/270);
 for(const [objects,color] of [[gt?im.gt:[],'#20AF65'],[pred?im.pred:[],'#E55353']])for(const d of objects){let [x1,y1,x2,y2]=d.box;const text=color==='#20AF65'?`标注${d.instance} ${d.label}`:`预测 ${d.label} ${(d.score*100).toFixed(2)}%`;out+=`<rect x="${Math.max(0,x1)}" y="${Math.max(0,y1)}" width="${Math.max(0,Math.min(im.width,x2)-Math.max(0,x1))}" height="${Math.max(0,Math.min(im.height,y2)-Math.max(0,y1))}" fill="none" stroke="${color}" stroke-width="${stroke}"/><text x="${Math.max(0,Math.min(im.width-260,x1))}" y="${Math.max(font,y1-font/5)}" font-family="Microsoft YaHei" font-size="${font}" fill="white" stroke="#162635" stroke-width="${Math.max(1,font/10)}" paint-order="stroke">${esc(text)}</text>`;}
 return out+'</svg>';}
function zoom(src,title){$('zoomImage').src=src;$('zoomTitle').textContent=title;$('zoom').showModal();}
function save(){const c=cards[index];answers[c.name]={decision:$('decision').value,notes:$('notes').value};try{localStorage.setItem(key,JSON.stringify(answers));$('saveState').textContent='已保存在本浏览器；不会自动修改标注。完成后复制汇总发给Luna。';}catch(e){$('saveState').textContent='浏览器不能保存本地意见，请复制下方汇总后再关闭页面。';}}
function render(){const c=cards[index],a=answers[c.name]||{};$('select').value=String(index);$('name').textContent=c.name+'：'+c.issue;$('question').textContent=c.question;$('count').textContent=`${index+1} / 8`;
 $('labels').textContent=`当前XML有${c.source.gt.length}个实例：`+c.source.gt.map(d=>`实例${d.instance} ${d.label}`).join('；');
 $('leftTitle').textContent=c.name+'（待复核训练图）';$('left').innerHTML=svg(c.source,$('showGT').checked,$('showPred').checked);$('left').onclick=()=>zoom(c.source.image,c.name+' 原图，无叠加框');
 const r=c.partner||c.source;$('rightTitle').textContent=c.partner?c.partner.name+(c.partner.name==='dashanque_119.jpg'?'（仅参考，已排除）':'（同源对照）'):'同一张原图，不叠加框';$('right').innerHTML=svg(r,c.partner?$('showGT').checked:false,c.partner?$('showPred').checked:false);$('right').onclick=()=>zoom(r.image,r.name+' 原图，无叠加框');
 $('crops').innerHTML=c.source.crops.map((d,i)=>`<div class="crop-card"><p>实例${d.instance}：${esc(d.label)}（仅表示现有标签）</p><img class="crop" data-index="${i}" src="${d.image}" alt="标注鸟体裁剪"></div>`).join('');
 $('crops').querySelectorAll('img').forEach(el=>el.onclick=()=>{const d=c.source.crops[Number(el.dataset.index)];zoom(d.image,`${c.name} 实例${d.instance}鸟体裁剪`);});
 const rows=[...c.source.gt.map(d=>['人工XML',d.instance,d.label,'',d.box]),...c.source.pred.map((d,i)=>['模型提示',i+1,d.label,(d.score*100).toFixed(2)+'%',d.box])];
 $('table').innerHTML='<table><thead><tr><th>来源</th><th>编号</th><th>类别</th><th>模型分数</th><th>框坐标xyxy</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((v,i)=>'<td>'+esc(i===4?v.map(x=>x.toFixed(1)).join(', '):v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 $('decision').value=a.decision||'';$('notes').value=a.notes||'';$('saveState').textContent='意见只在本浏览器本地保存，不会自动修改XML或训练数据。';$('prev').disabled=index===0;$('next').disabled=index===7;
}
$('select').innerHTML=cards.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join('');
$('prev').onclick=()=>{save();if(index>0){index--;render();}};$('next').onclick=()=>{save();if(index<7){index++;render();}};$('select').onchange=()=>{save();index=Number($('select').value);render();};
$('showGT').onchange=render;$('showPred').onchange=render;$('decision').onchange=save;$('notes').oninput=save;
$('copy').onclick=async()=>{save();const text='八张疑难训练图复核意见（请记录后再决定是否更改标注）：\n\n'+cards.map(c=>{const a=answers[c.name]||{};return c.name+'：'+(a.decision||'尚未检查')+'\n说明：'+(a.notes||'未填写');}).join('\n\n');$('output').value=text;try{await navigator.clipboard.writeText(text);$('copyState').textContent='已复制，可直接发给Luna。';}catch(e){$('output').focus();$('output').select();$('copyState').textContent='请按Ctrl+C复制已选中的汇总，再发给Luna。';}};
$('close').onclick=()=>$('zoom').close();render();
</script></body></html>
