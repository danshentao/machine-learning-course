<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30%阈值错分类裁剪诊断</title><style>
body{font:16px "Microsoft YaHei",sans-serif;margin:0;background:#f3f6fa;color:#24374a}main{max-width:1700px;margin:auto;padding:20px}h1{font-size:26px}p{line-height:1.7}.bar{position:sticky;top:0;background:#f3f6fa;padding:14px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:2}select,button{font:inherit;padding:7px}.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel{padding:14px;background:white;border:1px solid #dae2ec}.panel img{width:100%;height:410px;object-fit:contain;cursor:zoom-in}.hint{color:#65768a}.notice{padding:14px;background:#fff3d7;border-left:4px solid #d99a20}.good{color:#168552}.bad{color:#c6322b}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;background:white;font-size:14px}td,th{padding:9px;border-bottom:1px solid #d8e1eb;text-align:left}th{background:#25476a;color:white}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:90vw;max-height:83vh}dialog::backdrop{background:#0008}@media(max-width:1000px){.panels{grid-template-columns:1fr}}
</style><main><h1>30%阈值下：为什么鸟类分错？</h1><p>固定现有最终权重，比较检测框裁剪与人工框裁剪；另试检测框外扩0%、5%、15%、25%。原方案外扩15%。人工框用于诊断原因，不参与实际检测。</p><p class="hint">只检查30%显示结果中与原图所属类别不同的图片。这是选出的错误子集，某裁剪方式在这里分对，不代表全体验证集变好。没有匹配人工框的预测须先人工复核，不能擅自认定背景或更改标签。</p><div id="summary"></div><div class="bar"><select id="model"><option value="resnet">ResNet18</option><option value="bilinear">Bilinear CNN</option></select><select id="filter"><option value="all">全部类别分歧</option><option value="crop">人工框能分对，检测框分错</option><option value="classifier">人工框与检测框都分错</option><option value="unmatched">没有匹配人工鸟框</option></select><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span></div><h2 id="filename"></h2><p class="notice" id="diagnosis"></p><div class="panels"><section class="panel"><h3>原图</h3><img id="original"></section><section class="panel"><h3 id="detTitle"></h3><img id="detCrop"></section><section class="panel"><h3 id="gtTitle"></h3><img id="gtCrop"><p id="gtNote"></p></section></div><h3>不同裁剪方式的分类结果</h3><div class="scroll" id="table"></div><p class="hint">类别参照使用匹配的人工实例标签；没有人工匹配时仅参照所属目录，不代表该候选真的是鸟。八类得分是模型输出，未经概率校准。</p></main><dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),LABELS={det_0:'检测框，不外扩',det_5:'检测框，外扩5%',det_15:'检测框，外扩15%（原方案）',det_25:'检测框，外扩25%',gt_15:'人工框，外扩15%（仅诊断）'};let filtered=[],index=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=x=>(100*x).toFixed(2)+'%';
function render(){const c=filtered[index],model=$('model').value;$('prev').disabled=index<=0;$('next').disabled=index>=filtered.length-1;$('select').value=String(index);$('count').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';if(!c){$('filename').textContent='没有符合条件的案例';$('diagnosis').textContent='';for(const id of ['original','detCrop','gtCrop']){$(id).removeAttribute('src');$(id).style.visibility='hidden';}$('table').innerHTML='';return;}for(const id of ['original','detCrop'])$(id).style.visibility='visible';const res=c.results[model],reference=c.linked_annotation?.class_name||c.folder_class;$('filename').textContent=c.filename+' · 候选'+c.candidate_index;$('diagnosis').textContent=(c.diagnosis[model]||'此模型与所属类别一致')+`；所属类别 ${c.folder_class}；匹配人工类别 ${c.linked_annotation?.class_name||'无'}；检测分数 ${pct(c.detector_score)}。`;$('original').src=c.image;$('detCrop').src=c.crops.det_15;$('detTitle').textContent='检测框15%裁剪：'+res.det_15.class_name+' '+pct(res.det_15.top_score);if(c.crops.gt_15){$('gtCrop').src=c.crops.gt_15;$('gtCrop').style.visibility='visible';$('gtTitle').textContent='人工框15%裁剪：'+res.gt_15.class_name+' '+pct(res.gt_15.top_score);$('gtNote').textContent='框IoU '+c.annotation_iou.toFixed(3);}else{$('gtCrop').removeAttribute('src');$('gtCrop').style.visibility='hidden';$('gtTitle').textContent='未匹配人工框';$('gtNote').textContent='先检查是否为背景误检、未标注鸟或框偏移。';}$('table').innerHTML='<table><thead><tr><th>裁剪方式</th><th>预测类别</th><th>最高分</th><th>与参照类别</th><th>八类得分</th></tr></thead><tbody>'+Object.entries(res).map(([k,d])=>`<tr><td>${LABELS[k]}</td><td>${esc(d.class_name)}</td><td>${pct(d.top_score)}</td><td class="${d.class_name===reference?'good':'bad'}">${d.class_name===reference?'一致':'不同'}（${esc(reference)}）</td><td>${Object.entries(d.scores).map(([n,s])=>esc(n)+' '+pct(s)).join('；')}</td></tr>`).join('')+'</tbody></table>';}
function filter(){const model=$('model').value,mode=$('filter').value;filtered=DATA.cases.filter(c=>{const d=c.diagnosis[model];return d&&(mode==='all'||(mode==='crop'&&d.startsWith('人工框能分对'))||(mode==='classifier'&&d.startsWith('人工框与检测框都分错'))||(mode==='unmatched'&&d.startsWith('未匹配')));});index=0;$('select').innerHTML=filtered.map((c,i)=>`<option value="${i}">${esc(c.filename)} · 候选${c.candidate_index}</option>`).join('');const s=DATA.summary[model];$('summary').textContent=`此模型涉及${s.folder_disagreement_images}张类别分歧图。`+Object.entries(s.diagnosis_counts).map(([n,v])=>n+'：'+v+'个框').join('；');render();}
$('model').onchange=filter;$('filter').onchange=filter;$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};for(const id of ['original','detCrop','gtCrop'])$(id).onclick=()=>{if(!$(id).getAttribute('src'))return;$('zoomImage').src=$(id).src;$('zoomName').textContent=$('filename').textContent;$('zoom').showModal();};$('close').onclick=()=>$('zoom').close();filter();
</script></html>
