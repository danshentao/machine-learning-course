<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最终显示鸟类与所属类别不同</title><style>
body{font:16px "Microsoft YaHei",sans-serif;background:#f3f6fa;color:#23364a;margin:0}main{max-width:1450px;margin:auto;padding:20px}p{line-height:1.7}.bar{position:sticky;top:0;z-index:2;background:#f3f6fa;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 0}select,button,input{font:inherit;padding:7px}button{cursor:pointer}.panels{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}.panel{background:white;padding:12px;border:1px solid #dae1ea}svg{width:100%;max-height:730px;display:block;cursor:zoom-in}h1{font-size:25px}h3{font-size:18px}.hint{color:#65778a}.warning{background:#fff0ed;border-left:4px solid #d64535;padding:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #d8e1eb;text-align:left}th{background:#25476a;color:white}.scroll{overflow:auto}.bad{color:#c52f29;font-weight:bold}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:90vw;max-height:83vh}dialog::backdrop{background:#0008}@media(max-width:850px){.panels{grid-template-columns:1fr}}
</style><main><h1>最终显示鸟类与图片所属类别不同</h1><p>只检查去重后、检测置信度严格超过50%的显示框。任一显示框的鸟类不同于原图所属类别目录，就收入本页；不比较鸟的数量、框位置或人工框匹配。没有显示框的图片不列为类别分歧。</p><p class="hint">范围为这次已推理的172张固定验证图。所属类别由原始数据集目录核实，标准名称按任务类别映射。这是类别分歧清单，需看图判断是否确实识别错误。</p><div id="summary"></div><div class="bar"><select id="model"><option value="resnet">ResNet18</option><option value="bilinear">Bilinear CNN</option></select><input id="search" placeholder="搜索文件名或所属类别"><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span><label><input id="gt" type="checkbox">叠加人工框</label></div><h2 id="filename"></h2><p class="warning" id="issue"></p><div class="panels"><section class="panel"><h3>最终显示框（红色表示类别不同）</h3><div id="view"></div></section><section class="panel"><h3>原图（点击放大）</h3><div id="raw"></div></section></div><h3>最终显示框数据</h3><div class="scroll" id="table"></div><p class="hint">红色：与所属类别不同；橙色：与所属类别一致；绿色：可选的人工XML框。检测置信度和分类最高分分别列出。</p></main><dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let filtered=[],index=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svg(r,annotate){let out=`<svg viewBox="0 0 ${r.width} ${r.height}" role="img" aria-label="${esc(r.filename)}"><image href="${r.image}" width="${r.width}" height="${r.height}"/>`;const f=Math.max(16,r.width/50),s=Math.max(2,r.width/400);const arr=annotate?r.displayed.map(d=>({d,c:d.class_name!==r.expected_class?'#dc302d':'#ea761d',t:d.class_name+' '+(d.detector_score*100).toFixed(1)+'%'})):[];if(annotate&&$('gt').checked)arr.push(...r.truth.map(d=>({d,c:'#18a45c',t:'标注 '+d.class_name})));for(const {d,c,t}of arr){const [x,y,x2,y2]=d.bbox_xyxy;out+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="${c}" stroke-width="${s}"/><text x="${Math.max(0,Math.min(x,r.width-320))}" y="${Math.max(f,y-4)}" font-size="${f}" fill="white" stroke="#263344" stroke-width="${f/10}" paint-order="stroke">${esc(t)}</text>`;}return out+'</svg>';}
function render(){const r=filtered[index];$('prev').disabled=index<=0;$('next').disabled=index>=filtered.length-1;$('select').value=String(index);$('count').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';if(!r){$('filename').textContent='没有符合筛选条件的图片';$('issue').textContent='';for(const id of ['view','raw','table'])$(id).innerHTML='';return;}$('filename').textContent=r.filename;$('issue').textContent=`图片所属：${r.expected_class}（${r.folder}）；不同的最终预测：`+[...new Set(r.mismatches.map(d=>d.class_name))].join('、');$('view').innerHTML=svg(r,true);$('raw').innerHTML=svg(r,false);$('table').innerHTML='<table><thead><tr><th>是否不同</th><th>预测类别</th><th>检测置信度</th><th>分类最高分</th><th>八类分类分数</th></tr></thead><tbody>'+r.displayed.map(d=>'<tr><td class="'+(d.class_name!==r.expected_class?'bad':'')+'">'+(d.class_name!==r.expected_class?'不同':'一致')+'</td><td>'+esc(d.class_name)+'</td><td>'+(d.detector_score*100).toFixed(2)+'%</td><td>'+(d.classifier_top_score*100).toFixed(2)+'%</td><td>'+Object.entries(d.classifier_scores).map(([n,v])=>esc(n)+' '+(v*100).toFixed(2)+'%').join('；')+'</td></tr>').join('')+'</tbody></table>';for(const id of ['view','raw'])$(id).onclick=()=>{$('zoomImage').src=r.image;$('zoomName').textContent=r.filename;$('zoom').showModal();};}
function filter(){const q=$('search').value.toLowerCase();filtered=DATA.rows.filter(r=>r.model===$('model').value&&(r.filename.toLowerCase().includes(q)||r.expected_class.includes(q)));index=0;$('select').innerHTML=filtered.map((r,i)=>`<option value="${i}">${esc(r.filename)} · ${esc(r.expected_class)}</option>`).join('');const s=DATA.summary[$('model').value];$('summary').textContent=`检查 ${s.checked_images} 张：${s.flagged_images} 张有不同类别，涉及 ${s.mismatched_displayed_boxes} 个显示框；另有 ${s.no_display_images} 张没有显示框，不收入本清单。`;render();}
$('model').onchange=filter;$('search').oninput=filter;$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('gt').onchange=render;$('close').onclick=()=>$('zoom').close();filter();
</script></html>
