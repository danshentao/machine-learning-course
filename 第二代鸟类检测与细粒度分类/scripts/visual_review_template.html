<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13张类别分歧图：辅助视觉复核</title><style>
body{font:16px "Microsoft YaHei",sans-serif;margin:0;color:#23364a;background:#f3f6fa}main{max-width:1500px;margin:auto;padding:20px}p{line-height:1.7}h1{font-size:26px}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;background:#f3f6fa;padding:14px 0;z-index:2}button,select,input{font:inherit;padding:7px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:14px;background:white;border:1px solid #dae2ec}svg{display:block;width:100%;max-height:690px;cursor:zoom-in}.notes{padding:18px;background:#fff4d9;border-left:4px solid #d99c22;margin:16px 0}.hint{color:#65778b}table{width:100%;border-collapse:collapse;background:white;font-size:14px}td,th{padding:9px;border-bottom:1px solid #d8e1eb;text-align:left}th{background:#25476a;color:white}.scroll{overflow:auto}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:90vw;max-height:83vh}dialog::backdrop{background:#0008}@media(max-width:850px){.panels{grid-template-columns:1fr}}
</style><main><h1>13张类别分歧图：辅助视觉复核意见</h1><p>范围：第47轮Bilinear CNN最佳权重、30%检测阈值下的13张类别分歧图，也覆盖该模型全部5张正确匹配减少图。目录拼音按任务类别映射；目录表示预期类别，但不自动证明每个实例都同类。</p><p class="hint">这是助手查看原图后的观察和推断，不是用户已确认标签，也不是权威物种鉴定。年龄和性别拿不准时记未知。原XML、人工确认、模型权重和评估数字均未修改。</p><div class="bar"><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span><label><input id="gt" type="checkbox" checked>人工框</label></div><h2 id="filename"></h2><div class="notes" id="notes"></div><div class="panels"><section class="panel"><h3>第60轮最终权重</h3><div id="final"></div></section><section class="panel"><h3>第47轮最佳权重</h3><div id="best"></div></section></div><p class="hint">蓝色：人工框；橙色：预测类别与目录一致；红色：预测类别不同。点击图片放大原图，不叠加框。</p><h3>模型输出明细</h3><div class="scroll" id="table"></div><h3>参考资料</h3><div id="references"></div></main><dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let index=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=x=>(x*100).toFixed(2)+'%';
function svg(r,ds){let out=`<svg viewBox="0 0 ${r.width} ${r.height}" role="img" aria-label="${esc(r.filename)}"><image href="${r.image}" width="${r.width}" height="${r.height}"/>`;const f=Math.max(16,r.width/50),s=Math.max(2,r.width/370);let boxes=ds.map(d=>({d,c:d.class_name!==r.expected?'#d9322c':'#e9751e',t:d.class_name+' 检测'+pct(d.detector_score)}));if($('gt').checked)boxes.push(...r.truth.map(d=>({d,c:'#2276ca',t:'标注 '+d.class_name})));for(const {d,c,t}of boxes){const [x,y,x2,y2]=d.bbox_xyxy;out+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="${c}" stroke-width="${s}"/><text x="${Math.max(0,Math.min(x,r.width-350))}" y="${Math.max(f,y-4)}" font-size="${f}" fill="white" stroke="#24374a" stroke-width="${f/10}" paint-order="stroke">${esc(t)}</text>`;}return out+'</svg>';}
function render(){const r=DATA.rows[index],n=r.note;$('select').value=String(index);$('count').textContent=`${index+1} / ${DATA.rows.length}`;$('prev').disabled=index===0;$('next').disabled=index===DATA.rows.length-1;$('filename').textContent=r.filename+' · 目录类别：'+r.expected;$('notes').innerHTML=[['问题类型',n.type],['可见观察',n.observation],['辅助判断',n.judgment],['年龄／性别',n.age],['建议',n.action]].map(([k,v])=>'<p><b>'+k+'：</b>'+esc(v)+'</p>').join('');$('final').innerHTML=svg(r,r.final);$('best').innerHTML=svg(r,r.best);for(const id of ['final','best'])$(id).onclick=()=>{$('zoomImage').src=r.image;$('zoomName').textContent=r.filename+' 原图';$('zoom').showModal();};$('table').innerHTML='<table><thead><tr><th>权重</th><th>类别</th><th>检测分数</th><th>分类分数</th><th>与人工框位置匹配</th></tr></thead><tbody>'+['final','best'].flatMap(v=>r[v].map(d=>`<tr><td>${v==='final'?'最终':'最佳'}</td><td>${esc(d.class_name)}</td><td>${pct(d.detector_score)}</td><td>${pct(d.classifier_top_score)}</td><td>${esc(d.spatial_status)}</td></tr>`)).join('')+'</tbody></table>';}
$('select').innerHTML=DATA.rows.map((r,i)=>`<option value="${i}">${esc(r.filename)} · ${esc(r.note.type)}</option>`).join('');$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('gt').onchange=render;$('close').onclick=()=>$('zoom').close();$('references').innerHTML=DATA.references.map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></p>`).join('');render();
</script></html>
