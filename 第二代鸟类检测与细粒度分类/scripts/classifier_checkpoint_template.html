<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最终与最佳分类权重对照</title><style>
body{font:16px "Microsoft YaHei",sans-serif;background:#f3f6fa;color:#23364a;margin:0}main{max-width:1550px;padding:20px;margin:auto}h1{font-size:26px}p{line-height:1.7}.hint{color:#65778b}.bar{position:sticky;top:0;background:#f3f6fa;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 0;z-index:2}select,button,input{font:inherit;padding:7px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:white;padding:14px;border:1px solid #dae2ec}svg{width:100%;display:block;max-height:720px;cursor:zoom-in}table{width:100%;border-collapse:collapse;background:white;font-size:14px}td,th{padding:9px;border-bottom:1px solid #d8e1eb;text-align:left}th{background:#25476a;color:white}.scroll{overflow:auto}.label{background:#e5edf7;padding:12px}.bad{color:#ca302b}.good{color:#138754}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:90vw;max-height:83vh}dialog::backdrop{background:#0008}@media(max-width:850px){.panels{grid-template-columns:1fr}}
</style><main><h1>分类器第60轮最终权重 vs 验证最佳权重</h1><p>固定同一172张验证图、30%检测阈值、同一去重鸟框和15%裁剪，只替换分类器权重。鸟框位置、检测分数、无框图片均不变。</p><p class="hint">“最佳”指训练时按146个人工框验证裁剪选出的已有权重，不保证整图端到端最佳。本页只比较最终显示结果，不计算全候选AP；仍是验证集探索。原有权重、预测、标注和正式配置均未修改。</p><div class="bar"><select id="model"><option value="resnet">ResNet18</option><option value="bilinear">Bilinear CNN</option></select><select id="filter"><option value="changed">预测类别发生变化</option><option value="all">全部172张</option><option value="improved">正确匹配增加</option><option value="regressed">正确匹配减少</option><option value="removed">所属类别分歧消除</option><option value="added">新增所属类别分歧</option><option value="remaining">最佳权重仍有类别分歧</option><option value="empty">没有显示框</option></select><input id="search" placeholder="搜索文件名或类别"><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span><label><input id="gt" type="checkbox">叠加人工框</label></div><div id="summary" class="scroll"></div><p id="changes"></p><h2 id="filename"></h2><p id="expected" class="label"></p><div id="panels" class="panels"></div><p class="hint">橙色：预测与所属类别一致；红色：类别不同；绿色：可选人工框。标签分别列出检测分数和分类分数；点击图片放大原图。</p><h3>最终显示框的分类数据</h3><div id="details" class="scroll"></div></main><dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let filtered=[],index=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=v=>(v*100).toFixed(2)+'%';
function svg(r,ds){let out=`<svg viewBox="0 0 ${r.width} ${r.height}" role="img" aria-label="${esc(r.filename)}"><image href="${r.image}" width="${r.width}" height="${r.height}"/>`;const f=Math.max(16,r.width/50),s=Math.max(2,r.width/370);let boxes=ds.map(d=>({d,c:d.class_name!==r.expected?'#d9322c':'#e9751e',t:d.class_name+' 检测'+pct(d.detector_score)+' 分类'+pct(d.classifier_top_score)}));if($('gt').checked)boxes.push(...r.truth.map(d=>({d,c:'#18a45d',t:'标注 '+d.class_name})));for(const {d,c,t}of boxes){const [x,y,x2,y2]=d.bbox_xyxy;out+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="${c}" stroke-width="${s}"/><text x="${Math.max(0,Math.min(x,r.width-550))}" y="${Math.max(f,y-4)}" font-size="${f}" fill="white" stroke="#24374a" stroke-width="${f/10}" paint-order="stroke">${esc(t)}</text>`;}return out+'</svg>';}
function render(){const r=filtered[index],model=$('model').value;$('prev').disabled=index<=0;$('next').disabled=index>=filtered.length-1;$('select').value=String(index);$('count').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';if(!r){$('filename').textContent='没有符合条件的图片';for(const id of ['expected','panels','details'])$(id).innerHTML='';return;}const m=r.models[model],epoch=DATA.metadata.weights[model].best.epoch;$('filename').textContent=r.filename;$('expected').textContent='原图所属类别：'+r.expected+'；人工实例 '+r.truth.length+' 个。';$('panels').innerHTML=['final','best'].map(v=>{const a=m[v];return `<section class="panel"><h3>${v==='final'?'第60轮最终权重':'第'+epoch+'轮验证最佳权重'}</h3><p>显示${a.displayed.length}框；正确匹配${a.TP}；未正确匹配预测${a.FP}；漏掉或分错实例${a.FN}</p>${svg(r,a.displayed)}</section>`;}).join('');$('panels').querySelectorAll('svg').forEach(el=>el.onclick=()=>{$('zoomImage').src=r.image;$('zoomName').textContent=r.filename+' 原图';$('zoom').showModal();});$('details').innerHTML='<table><thead><tr><th>权重</th><th>预测类别</th><th>检测分数</th><th>分类最高分</th><th>人工框位置诊断</th><th>八类分数</th></tr></thead><tbody>'+['final','best'].flatMap(v=>m[v].displayed.length?m[v].displayed.map(d=>`<tr><td>${v==='final'?'最终':'最佳'}</td><td class="${d.different_from_folder?'bad':''}">${esc(d.class_name)}</td><td>${pct(d.detector_score)}</td><td>${pct(d.classifier_top_score)}</td><td>${esc(d.spatial_status)}</td><td>${Object.entries(d.classifier_scores).map(([n,s])=>esc(n)+' '+pct(s)).join('；')}</td></tr>`):[`<tr><td>${v==='final'?'最终':'最佳'}</td><td colspan="5">无显示框</td></tr>`]).join('')+'</tbody></table>';}
function filter(){const model=$('model').value,mode=$('filter').value,q=$('search').value.toLowerCase();filtered=DATA.rows.filter(r=>{const a=r.models[model].final,b=r.models[model].best;const ok=mode==='all'||(mode==='changed'&&r.class_changed[model])||(mode==='improved'&&b.TP>a.TP)||(mode==='regressed'&&b.TP<a.TP)||(mode==='removed'&&a.class_disagreement&&!b.class_disagreement)||(mode==='added'&&!a.class_disagreement&&b.class_disagreement)||(mode==='remaining'&&b.class_disagreement)||(mode==='empty'&&b.no_display);return ok&&(r.filename.toLowerCase().includes(q)||r.expected.includes(q));});index=0;$('select').innerHTML=filtered.map((r,i)=>`<option value="${i}">${esc(r.filename)}</option>`).join('');const sum=DATA.summary[model];$('summary').innerHTML='<table><thead><tr><th>权重</th><th>正确匹配</th><th>未正确匹配预测</th><th>漏掉／分错实例</th><th>精确率</th><th>召回率</th><th>F1</th><th>类别分歧图片</th><th>无框图片</th></tr></thead><tbody>'+['final','best'].map(v=>{const s=sum[v];return `<tr><td>${v==='final'?'第60轮最终权重':'第'+DATA.metadata.weights[model].best.epoch+'轮最佳权重'}</td><td>${s.TP}</td><td>${s.FP}</td><td>${s.FN}</td><td>${pct(s.precision)}</td><td>${pct(s.recall)}</td><td>${pct(s.F1)}</td><td>${s.class_disagreement_images}</td><td>${s.no_display_images}</td></tr>`;}).join('')+'</tbody></table>';const c=DATA.changes[model];$('changes').textContent=`${c.changed_class_images.length}张预测类别变化；${c.correct_matches_increased.length}张正确匹配增加，${c.correct_matches_decreased.length}张减少；${c.folder_disagreement_removed.length}张消除所属类别分歧，${c.folder_disagreement_added.length}张新增分歧。`;render();}
$('model').onchange=filter;$('filter').onchange=filter;$('search').oninput=filter;$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('gt').onchange=render;$('close').onclick=()=>$('zoom').close();filter();
</script></html>
