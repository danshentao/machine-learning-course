<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30%、40%、50%检测阈值比较</title><style>
body{font:16px "Microsoft YaHei",sans-serif;margin:0;background:#f3f6fa;color:#23364a}main{max-width:1800px;margin:auto;padding:20px}h1{font-size:26px}p{line-height:1.7}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#f3f6fa;padding:12px 0;position:sticky;top:0;z-index:2}select,button,input{font:inherit;padding:7px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;background:white;font-size:14px}td,th{padding:9px;border-bottom:1px solid #dae2ec;text-align:left}th{background:#25476a;color:white}.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.panel{background:white;border:1px solid #d8e1eb;padding:12px}svg{display:block;width:100%;max-height:660px;cursor:zoom-in}h3{font-size:18px}.hint{color:#65778a}.label{background:#e5edf7;padding:12px}.bad{color:#c8322c;font-weight:bold}.good{color:#168652}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:90vw;max-height:83vh}dialog::backdrop{background:#0008}@media(max-width:1050px){.panels{grid-template-columns:1fr}}
</style><main><h1>第二代检测阈值：30%／40%／50%</h1><p>同一172张验证图、同一检测器和同一去重组，按检测分数严格超过阈值显示。两种分类器分别比较。正确匹配要求类别正确且框IoU≥0.5；使用当前XML作为参照。</p><p class="hint">未匹配人工框只是疑似误检、漏标、重复或框偏移，不能直接认定为背景误检。类别分歧图片只比较预测类别与原图所属类别。原始预测、权重、正式50%页面均未修改；这是验证集上的阈值探索。</p><div class="bar"><select id="model"><option value="resnet">ResNet18</option><option value="bilinear">Bilinear CNN</option></select><select id="filter"><option value="all">全部172张</option><option value="changed">30%与50%显示框有变化</option><option value="empty50">原50%没有显示框的13张</option><option value="new_unmatched">30%增加未匹配人工框</option><option value="new_class">30%新增所属类别分歧</option><option value="recovered">30%增加正确匹配</option></select><input id="search" placeholder="搜索文件名或类别"><button id="prev">上一张</button><select id="select"></select><button id="next">下一张</button><span id="count"></span><label><input type="checkbox" id="gt">叠加人工框</label></div><div class="scroll" id="summary"></div><p id="recovery"></p><h2 id="filename"></h2><p class="label" id="expected"></p><div class="panels" id="panels"></div><p class="hint">橙色：预测类别与所属类别一致；红色：类别不同；绿色：可选人工框。框标签显示检测置信度。点击图片放大原图。</p><h3>各阈值最终显示框明细</h3><div class="scroll" id="details"></div></main><dialog id="zoom"><button id="close">关闭</button><p id="zoomName"></p><img id="zoomImage"></dialog><script id="data" type="application/json">__PAYLOAD__</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),KEYS=['30','40','50'];let filtered=[],index=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=s=>(s*100).toFixed(2)+'%';
function svg(r,ds){let out=`<svg viewBox="0 0 ${r.width} ${r.height}" role="img" aria-label="${esc(r.filename)}"><image href="${r.image}" width="${r.width}" height="${r.height}"/>`;const f=Math.max(16,r.width/45),s=Math.max(2,r.width/360);let boxes=ds.map(d=>({d,color:d.class_name!==r.expected?'#d6322b':'#ec761e',text:d.class_name+' '+pct(d.detector_score)}));if($('gt').checked)boxes.push(...r.truth.map(d=>({d,color:'#19a45e',text:'标注 '+d.class_name})));for(const {d,color,text}of boxes){const [x,y,x2,y2]=d.bbox_xyxy;out+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="${color}" stroke-width="${s}"/><text x="${Math.max(0,Math.min(x,r.width-300))}" y="${Math.max(f,y-4)}" font-size="${f}" fill="white" stroke="#26374a" stroke-width="${f/10}" paint-order="stroke">${esc(text)}</text>`;}return out+'</svg>';}
function render(){const r=filtered[index];$('prev').disabled=index<=0;$('next').disabled=index>=filtered.length-1;$('select').value=String(index);$('count').textContent=filtered.length?`${index+1} / ${filtered.length}`:'0 / 0';if(!r){$('filename').textContent='没有符合筛选条件的图片';for(const id of ['expected','panels','details'])$(id).innerHTML='';return;}const m=r.models[$('model').value];$('filename').textContent=r.filename;$('expected').textContent=`原图所属：${r.expected}（${r.folder}）；人工XML ${r.truth.length} 个实例。`;$('panels').innerHTML=KEYS.map(k=>{const a=m[k];return `<section class="panel"><h3>检测分数 &gt; ${k}%：${a.displayed.length} 个框</h3><p>正确匹配 ${a.TP} ／ 未正确匹配预测 ${a.FP} ／ 未正确识别实例 ${a.FN}</p>${svg(r,a.displayed)}</section>`;}).join('');$('panels').querySelectorAll('svg').forEach(el=>el.onclick=()=>{$('zoomImage').src=r.image;$('zoomName').textContent=r.filename+' 原图';$('zoom').showModal();});$('details').innerHTML='<table><thead><tr><th>阈值</th><th>预测类别</th><th>检测分数</th><th>分类最高分</th><th>人工框位置诊断</th><th>与所属类别</th><th>八类分类分数</th></tr></thead><tbody>'+KEYS.flatMap(k=>m[k].displayed.length?m[k].displayed.map(d=>`<tr><td>&gt;${k}%</td><td>${esc(d.class_name)}</td><td>${pct(d.detector_score)}</td><td>${pct(d.classifier_top_score)}</td><td>${esc(d.spatial_status)}</td><td class="${d.different_from_folder?'bad':''}">${d.different_from_folder?'不同':'一致'}</td><td>${Object.entries(d.classifier_scores).map(([n,v])=>esc(n)+' '+pct(v)).join('；')}</td></tr>`):[`<tr><td>&gt;${k}%</td><td colspan="6">无显示框</td></tr>`]).join('')+'</tbody></table>';}
function filter(){const model=$('model').value,mode=$('filter').value,q=$('search').value.toLowerCase();filtered=DATA.rows.filter(r=>{const m=r.models[model];let ok=mode==='all'||(mode==='changed'&&m['30'].displayed.length!==m['50'].displayed.length)||(mode==='empty50'&&m['50'].no_display)||(mode==='new_unmatched'&&m['30'].unmatched_annotation_boxes>m['50'].unmatched_annotation_boxes)||(mode==='new_class'&&m['30'].class_disagreement&&!m['50'].class_disagreement)||(mode==='recovered'&&m['30'].TP>m['50'].TP);return ok&&(r.filename.toLowerCase().includes(q)||r.expected.includes(q));});index=0;$('select').innerHTML=filtered.map((r,i)=>`<option value="${i}">${esc(r.filename)}</option>`).join('');const sum=DATA.summary[model];$('summary').innerHTML='<table><thead><tr><th>阈值</th><th>显示框</th><th>正确匹配</th><th>未正确匹配预测</th><th>漏掉／分错实例</th><th>精确率</th><th>召回率</th><th>F1</th><th>无显示框图片</th><th>所属类别分歧图</th><th>未匹配人工框</th><th>位置匹配但分错类</th></tr></thead><tbody>'+KEYS.map(k=>{const a=sum[k];return `<tr><td>&gt;${k}%</td><td>${a.displayed_boxes}</td><td>${a.TP}</td><td>${a.FP}</td><td>${a.FN}</td><td>${pct(a.precision)}</td><td>${pct(a.recall)}</td><td>${pct(a.F1)}</td><td>${a.no_display_images}</td><td>${a.class_disagreement_images}</td><td>${a.unmatched_annotation_boxes}</td><td>${a.spatially_matched_wrong_class}</td></tr>`;}).join('')+'</tbody></table>';const rec=DATA.recovery[model];$('recovery').textContent=`原50%无框的13张：30%时${rec['30'].now_has_display}张出现框，其中${rec['30'].now_has_correct_match}张至少有一个正确匹配；40%时${rec['40'].now_has_display}张出现框，其中${rec['40'].now_has_correct_match}张至少有一个正确匹配。`;render();}
$('model').onchange=filter;$('filter').onchange=filter;$('search').oninput=filter;$('select').onchange=()=>{index=Number($('select').value);render();};$('prev').onclick=()=>{index--;render();};$('next').onclick=()=>{index++;render();};$('gt').onchange=render;$('close').onclick=()=>$('zoom').close();filter();
</script></html>
