# PaddleDetection release/2.9 official PP-YOLOE-s; fixed 640 input baseline.
_BASE_: [
  '../third_party/PaddleDetection/configs/ppyoloe/ppyoloe_crn_s_300e_coco.yml',
]

metric: COCO
num_classes: 8
use_gpu: true
epoch: 100
snapshot_epoch: 1
log_iter: 20
worker_num: 0  # Disable loader worker processes for stable native Windows training.
weights: runs/baseline_640/model_final
pretrain_weights: weights/ppyoloe_crn_s_300e_coco.pdparams

LearningRate:
  base_lr: 0.000625  # Scale official base_lr=0.01 at effective batch 64 to local batch 4.
  schedulers:
    - name: CosineDecay
      max_epochs: 100
    - name: LinearWarmup
      start_factor: 0.0
      epochs: 5

TrainDataset:
  name: COCODataSet
  image_dir: images/train
  anno_path: annotations/instances_train.json
  dataset_dir: data/prepared
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  image_dir: images/val
  anno_path: annotations/instances_val.json
  dataset_dir: data/prepared
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: annotations/instances_val.json
  dataset_dir: data/prepared

TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomFlip: {prob: 0.5}
    - Resize: {target_size: [640, 640], keep_ratio: false, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - Permute: {}
  batch_transforms:
    - PadGT: {}
  batch_size: 4
  shuffle: true
  drop_last: false
  use_shared_memory: false
  collate_batch: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: false, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - Permute: {}
  batch_size: 2

TestReader:
  inputs_def:
    image_shape: [3, 640, 640]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: false, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - Permute: {}
  batch_size: 1

PPYOLOEHead:
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.001
    nms_threshold: 0.7
